 [[1,3],[17,3],[1,15],[17,15]].forEach(t=>{let b=1e9,p=null;for(let r=1;r<H-1;r++)for(let c=1;c<W-1;c++)if(g[r][c]=='.'&&!fx[r][c]){const d=Math.abs(c-t[0])+Math.abs(r-t[1]);if(d<b){b=d;p=[r,c]}}if(p)g[p[0]][p[1]]='o'});
 return g;
}
function sfxBuf(k,loop){if(!AC||!BUF[k])return null;const s=AC.createBufferSource();s.buffer=BUF[k];s.loop=!!loop;return s}

function tone(f,d,ty,v,t0,f2){if(!AC||mute)return;const o=AC.createOscillator(),gn=AC.createGain(),s=AC.currentTime+(t0||0);o.type=ty||'square';o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);gn.gain.setValueAtTime(v||.06,s);gn.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(gn);gn.connect(AC.destination);o.start(s);o.stop(s+d+.02)}
const sWaka=()=>{lastEat=tick;if(BUF.waka)return;wk^=1;tone(wk?260:420,.08,'triangle',.1,0,wk?420:260)},sPow=()=>tone(150,.3,'sawtooth',.08,0,320),sEat=()=>tone(200,.3,'square',.07,0,1400),sBomb=()=>tone(900,.6,'sawtooth',.1,0,50),sFruit=()=>{tone(700,.1,'square',.07);tone(1050,.18,'square',.07,.1)},sUp=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.07,i*.1)),sStar=()=>[392,523,659,784,1047].forEach((f,i)=>tone(f,.08,'square',.06,i*.06)),sDie=()=>{if(playBuf('death',1))return;for(let i=0;i<12;i++)tone(900-i*62,.11,'sawtooth',.07,i*.09,850-i*62)};
function sIntro(){if(playBuf('intro',1))return;const A=[493.9,987.8,740,622.3,987.8,740,622.3],C=[523.3,1046.5,784,659.3,1046.5,784,659.3];[...A,...C,...A,622.3,659.3,698.5,698.5,740,784,830.6,830.6,880,987.8].forEach((f,i)=>tone(f,.1,'square',.06,i*.115))}
const FR=['🍒','🍓','🍊','🍎','🍈','🚀','🔔','🔑'],FP=[100,300,500,700,1000,2000,3000,5000];
function bfs(){const seen=new Set(['9,15']),q=[[9,15]];RC=[];while(q.length){const[c,r]=q.shift();RC.push([c,r]);[[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{const nc=(c+d[0]+W)%W,nr=r+d[1];if(nr<0||nr>=H)return;const ch=map[nr][nc];if(ch=='#'||ch=='-')return;const k=nc+','+nr;if(!seen.has(k)){seen.add(k);q.push([nc,nr])}})}}
function spawn(){const c=RC.filter(q=>Math.hypot(q[0]*T-pac.x,q[1]*T-pac.y)>4*T);if(!c.length)return;const q=c[Math.random()*c.length|0],p=Math.random();item={x:q[0]*T,y:q[1]*T,k:p<.6?'f':p<.8?'b':'s',t:600}}
function take(){
 const k=item.k,x=item.x,y=item.y;item=null;
 if(k=='f'){const p=FP[Math.min(level-2,7)];score+=p;pop={x,y,s:'+'+p,t:45};sFruit()}
 else if(k=='b'){ghosts.forEach(gh=>{if(gh.mode!='eyes'){gh.fr=false;gh.mode='eyes';kills++;score+=200}});flash=30;pop={x,y,s:'¡BOOM!',t:45};sBomb()}
 else{star=480;pop={x,y,s:'¡ESTRELLA!',t:45};sStar()}
}
function die(){sDie();state='dead';wait=90;lives--;deaths++;if(score>best){best=score;try{localStorage.setItem('pm',best)}catch(e){}}}
function update(){
 tick++;
 if(tick%6==0)musTick();
 if(tick%90==0&&AC){if(AC.state!='running')AC.resume();for(const k of['siren','waka'])if(BUF[k]&&!LP[k])startLoop(k)}
 if(state!='play'&&tick%6==0){vol('siren',0);vol('waka',0)}
 if(state=='ready'){if(--wait<=0)state='play';return}
 if(state=='dead'){if(--wait<=0)quiz();return}
 if(state!='play')return;
 if(nd&&(pac.dx||pac.dy)&&nd[0]==-pac.dx&&nd[1]==-pac.dy){pac.dx=nd[0];pac.dy=nd[1]}
 if(al(pac)){
  const c=pac.x/T,r=pac.y/T,ch=map[r][c];
  if(ch=='.'){map[r][c]=' ';score+=10;dots--;sWaka()}
  else if(ch=='o'){map[r][c]=' ';score+=50;dots--;sPow();fright=Math.max(45,420-gd()*40);eatn=0;
   ghosts.forEach(gh=>{if(gh.mode!='eyes'){gh.fr=true;gh.dx*=-1;gh.dy*=-1}})}
  if(nd&&can(pac,nd[0],nd[1]))[pac.dx,pac.dy]=nd;
  if(!can(pac,pac.dx,pac.dy))pac.dx=pac.dy=0;
 }
 if(pac.dx||pac.dy){pac.a++;ang=Math.atan2(pac.dy,pac.dx)}
 pac.x=(pac.x+pac.dx*3+W*T)%(W*T);pac.y+=pac.dy*3;
 if(fright>0&&--fright==0)ghosts.forEach(gh=>gh.fr=false);
 ghosts.forEach(updG);
 if(star>0)star--;if(flash>0)flash--;
 if(level>=2){
  if(item){if(--item.t<=0)item=null;else if(Math.hypot(item.x-pac.x,item.y-pac.y)<T*.7)take()}
  else if(--spawnT<=0){spawn();spawnT=420}
 }
 if(fright>0){if(tick%12==0)tone((tick/12|0)%2?330:247,.1,'sawtooth',.04)}
 else if(!BUF.siren&&tick%12==0)tone(520+260*Math.sin(tick/40),.11,'square',.018);
 if(tick%6==0&&BUF.siren){const mv=pac.dx||pac.dy,eat=mv&&tick-lastEat<14;vol('waka',eat?.7:0);vol('siren',fright>0||eat?0:mv?.4:.5)}
 for(const gh of ghosts){
  if(gh.mode=='eyes'||gh.mode=='house')continue;
  if(Math.hypot(gh.x-pac.x,gh.y-pac.y)<T*.6){
   if(gh.fr||star>0){gh.fr=false;gh.mode='eyes';kills++;score+=200*2**Math.min(eatn++,3);sEat()}
   else{die();return}
  }
 }
 if(dots<=0){load();score+=300}
 if(--lt<=0){
  if(level>=200){won=true;state='over';if(score>best){best=score;try{localStorage.setItem('pm',best)}catch(e){}}}
  else{level++;score+=500;lt=6600;load();reset();state='ready';wait=270;sIntro()}
 }
}
function dg(gh){
 g.globalAlpha=gh.rg&&(tick>>2)%2?.35:1;
 const x=gh.x+T/2,y=gh.y+T/2,r=T/2-2;
 if(gh.mode!='eyes'){
  g.fillStyle=gh.fr?((fright<120&&(tick>>3)%2)?'#fff':'#2a3cff'):gh.c;
  g.beginPath();g.arc(x,y-1,r,Math.PI,0);g.lineTo(x+r,y+r);g.lineTo(x+r/2,y+r-4);g.lineTo(x,y+r);g.lineTo(x-r/2,y+r-4);g.lineTo(x-r,y+r);g.closePath();g.fill();
 }
 g.fillStyle='#fff';[-4,4].forEach(o=>{g.beginPath();g.arc(x+o,y-3,3,0,7);g.fill()});
 g.fillStyle=gh.fr&&gh.mode!='eyes'?'#f55':'#12f';[-4,4].forEach(o=>{g.beginPath();g.arc(x+o+gh.dx*1.5,y-3+gh.dy*1.5,1.5,0,7);g.fill()});
 g.globalAlpha=1;
}
function draw(){
 g.setTransform(sc,0,0,sc,0,0);g.fillStyle='#000';g.fillRect(0,0,456,504);
 {const ti=state=='title'||state=='tuto';if(draw.ti!==ti){draw.ti=ti;document.getElementById('hud').style.visibility=document.getElementById('hud2').style.visibility=ti?'hidden':'visible'}if(ti){state=='tuto'?drawTuto():drawTitle();return}}
 if(!wallOK||wallC.width!=cv.width){renderWalls();wallOK=true}g.drawImage(wallC,0,0,456,504);
 for(let r=0;r<H;r++)for(let c=0;c<W;c++){
  const ch=map[r][c],x=c*T,y=r*T;
  if(ch=='.'){g.fillStyle='#ffd9a0';g.fillRect(x+T/2-2,y+T/2-2,4,4)}
  else if(ch=='o'){g.fillStyle='#ffd9a0';g.beginPath();g.arc(x+T/2,y+T/2,(tick>>4)%2?7:5,0,7);g.fill()}
  else if(ch=='-'){g.fillStyle='#ffb8ff';g.fillRect(x,y+T/2-2,T,4)}
 }
 if(item&&(item.t>120||(tick>>3)%2)){g.font='20px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';g.fillText(item.k=='f'?FR[Math.min(level-2,7)]:item.k=='b'?'💣':'⭐',item.x+T/2,item.y+T/2+1);g.textBaseline='alphabetic'}
 if(pop&&pop.t-->0){g.font='bold 14px sans-serif';g.textAlign='center';g.fillStyle='#fff';g.fillText(pop.s,pop.x+T/2,pop.y-(45-pop.t)/3)}
 if(state!='dead'||wait>45){
  const m=state=='dead'?0.8:Math.abs(Math.sin(pac.a*.3))*.28+.03;
  const px=pac.x+T/2,py=pac.y+T/2;
  g.fillStyle=star>0&&(tick>>2)%2?'#fff':'#ffe600';g.beginPath();g.moveTo(px,py);g.arc(px,py,T/2-2,ang+m*Math.PI,ang+(2-m)*Math.PI);g.closePath();g.fill();
 }
 if(state!='dead')ghosts.forEach(dg);

 const say=state=='start'?'TOCA PARA JUGAR':state=='ready'?'NIVEL '+level:state=='over'?(won?'¡GANASTE!':'FIN DEL JUEGO'):state=='pause'?'PAUSA':'';
 if(say){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,9*T+4,456,3*T);g.fillStyle='#ffe600';g.font='bold 26px "Courier New",monospace';g.textAlign='center';g.fillText(say,228,11*T-2);
  if(state=='over'||state=='pause'){g.font='16px "Courier New",monospace';g.fillStyle='#fff';g.fillText(state=='over'?'Toca para volver al menú':'Toca o pulsa una tecla',228,11*T+16)}}
 document.getElementById('s').textContent='PUNTOS '+score;
 document.getElementById('v').textContent='●'.repeat(Math.max(lives,0))+' ⚠'+gd();
 document.getElementById('b').textContent='RÉCORD '+Math.max(best,score);
 {const q=Math.ceil(lt/60);document.getElementById('h2').textContent='NIVEL '+level+'/200 · '+Math.floor(q/60)+':'+String(q%60).padStart(2,'0')+(star>0?' ⭐'+Math.ceil(star/60):'')}
}

});
